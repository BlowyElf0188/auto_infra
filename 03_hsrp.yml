---
- name: Configurar HSRP IPv4
  hosts: cisco_routers
  gather_facts: false
  collections:
    - cisco.ios

  tasks:
    - name: Configurar grupos HSRP definidos por router
      cisco.ios.ios_config:
        parents: "interface {{ item.interface }}"
        lines:
          - "standby {{ item.group }} ip {{ item.virtual_ip }}"
          - "standby {{ item.group }} priority {{ item.priority }}"
          - standby {{ item.group }} preempt
      loop: "{{ hsrp_groups }}"
      loop_control:
        label: "{{ item.interface }} grupo {{ item.group }}"
