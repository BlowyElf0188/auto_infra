---
- name: Aplicar seguridad administrativa básica
  hosts: all
  gather_facts: false
  collections:
    - cisco.ios

  tasks:
    - name: Configurar usuario y parámetros globales de SSH
      cisco.ios.ios_config:
        lines:
          - "username {{ ansible_user }} privilege 15 secret {{ vault_admin_password }}"
          - service password-encryption
          - "ip domain-name {{ domain_name }}"
          - ip ssh version 2
          - ip ssh time-out 60
          - ip ssh authentication-retries 2
      no_log: true

    - name: Restringir VTY a SSH con usuario local
      cisco.ios.ios_config:
        parents: "line vty 0 4"
        lines:
          - login local
          - transport input ssh
          - exec-timeout 10 0
