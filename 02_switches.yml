---
- name: Configurar switches Cisco
  hosts: cisco_switches
  gather_facts: false
  collections:
    - cisco.ios

  tasks:
    - name: Configurar nombre y dominio
      cisco.ios.ios_config:
        lines:
          - "hostname {{ device_hostname }}"
          - no ip domain-lookup
          - "ip domain-name {{ domain_name }}"

    - name: Crear VLANs
      cisco.ios.ios_config:
        parents: "vlan {{ item.id }}"
        lines:
          - "name {{ item.name }}"
      loop: "{{ vlans }}"
      loop_control:
        label: "VLAN {{ item.id }}"

    - name: Configurar SVI de gestión
      cisco.ios.ios_config:
        parents: "interface vlan {{ management_svi.vlan }}"
        lines:
          - "ip address {{ management_svi.address }} {{ management_svi.mask }}"
          - no shutdown
      when: management_svi | length > 0

    - name: Configurar gateway de gestión
      cisco.ios.ios_config:
        lines:
          - "ip default-gateway {{ management_svi.gateway }}"
      when: management_svi | length > 0

    - name: Configurar puertos de acceso y troncal
      cisco.ios.ios_config:
        parents: "interface {{ item.name }}"
        lines: "{{ item.lines }}"
      loop: "{{ switchports }}"
      loop_control:
        label: "{{ item.name }}"
